<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Parky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">Parky</a>
                <ul class="nav-links">
                    <li><a href="/map">Carte</a></li>
                    <li><a href="/dashboard">Mes réservations</a></li>
                    <li><a href="/owner">Propriétaire</a></li>
                    <li><a href="/auth" style="opacity: 1;">Connexion</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Connexion</div>
            <div class="tab" onclick="switchTab('register')">Inscription</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="tab-content">
            <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">Connectez-vous</h2>

            <div class="user-type-selector">
                <button class="user-type-btn active" id="loginDriverBtn" onclick="selectLoginType('driver')">
                    <div class="user-type-icon">🚗</div>
                    <div class="user-type-title">Conducteur</div>
                    <div class="user-type-subtitle">Je cherche des places</div>
                </button>
                <button class="user-type-btn" id="loginOwnerBtn" onclick="selectLoginType('owner')">
                    <div class="user-type-icon">🏠</div>
                    <div class="user-type-title">Propriétaire</div>
                    <div class="user-type-subtitle">Je loue mes places</div>
                </button>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin: 1rem 0;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox" id="rememberMe">
                        Se souvenir de moi
                    </label>
                    <a href="#" style="color: #667eea; text-decoration: none; font-size: 0.9rem;">
                        Mot de passe oublié?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    Se connecter
                </button>
            </form>

            <div style="text-align: center; margin: 1.5rem 0; color: #666;">
                ou connectez-vous avec
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <button class="btn btn-secondary" onclick="socialLogin('google')" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    🔍 Google
                </button>
                <button class="btn btn-secondary" onclick="socialLogin('facebook')" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    📘 Facebook
                </button>
            </div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="tab-content" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">Créer un compte</h2>
            
            <div class="user-type-selector">
                <button class="user-type-btn active" id="driverBtn" onclick="selectUserType('driver')">
                    <div class="user-type-icon">🚗</div>
                    <div class="user-type-title">Conducteur</div>
                    <div class="user-type-subtitle">Je cherche des places</div>
                </button>
                <button class="user-type-btn" id="ownerBtn" onclick="selectUserType('owner')">
                    <div class="user-type-icon">🏠</div>
                    <div class="user-type-title">Propriétaire</div>
                    <div class="user-type-subtitle">Je loue mes places</div>
                </button>
            </div>

            <form onsubmit="handleRegister(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="firstName">Prénom</label>
                        <input type="text" id="firstName" placeholder="Prénom" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Nom</label>
                        <input type="text" id="lastName" placeholder="Nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" placeholder="06 12 34 56 78" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Mot de passe</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>

                <div style="margin: 1rem 0;">
                    <label style="display: flex; align-items: start; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox" id="acceptTerms" required style="margin-top: 0.2rem;">
                        <span>J'accepte les <a href="#" style="color: #667eea;">conditions d'utilisation</a> et la <a href="#" style="color: #667eea;">politique de confidentialité</a></span>
                    </label>
                </div>

                <div style="margin: 1rem 0;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox" id="newsletter">
                        Recevoir les actualités et offres par email
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    Créer mon compte
                </button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e9ecef; color: #666; font-size: 0.9rem;">
            En vous connectant, vous acceptez nos conditions d'utilisation et notre politique de confidentialité
        </div>
    </div>

    <script>
        let selectedUserType = 'driver';
        let selectedLoginType = 'driver';

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'login' ? '1' : '2'})`).classList.add('active');

            // Update tab content
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        function selectLoginType(type) {
            selectedLoginType = type;

            // Reset buttons
            document.getElementById('loginDriverBtn').style.borderColor = '#e9ecef';
            document.getElementById('loginDriverBtn').style.backgroundColor = 'white';
            document.getElementById('loginOwnerBtn').style.borderColor = '#e9ecef';
            document.getElementById('loginOwnerBtn').style.backgroundColor = 'white';

            // Highlight selected
            const selectedBtn = document.getElementById('login' + type.charAt(0).toUpperCase() + type.slice(1) + 'Btn');
            selectedBtn.style.borderColor = '#4A90E2';
            selectedBtn.style.backgroundColor = '#f8f9ff';
        }

        function selectUserType(type) {
            selectedUserType = type;

            // Reset buttons
            document.getElementById('driverBtn').style.borderColor = '#e9ecef';
            document.getElementById('driverBtn').style.backgroundColor = 'white';
            document.getElementById('ownerBtn').style.borderColor = '#e9ecef';
            document.getElementById('ownerBtn').style.backgroundColor = 'white';

            // Highlight selected
            const selectedBtn = document.getElementById(type + 'Btn');
            selectedBtn.style.borderColor = '#4A90E2';
            selectedBtn.style.backgroundColor = '#f8f9ff';
        }

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Simulate login
            localStorage.setItem('user', JSON.stringify({
                email: email,
                name: email.split('@')[0],
                type: selectedLoginType
            }));

            // Show success notification
            showNotification('Connexion réussie!', 'success');

            // Redirect based on user type
            setTimeout(() => {
                window.location.href = selectedLoginType === 'owner' ? '/owner' : '/home';
            }, 1000);
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas');
                return;
            }
            
            // Simulate registration
            localStorage.setItem('user', JSON.stringify({
                email: email,
                name: firstName + ' ' + lastName,
                phone: phone,
                type: selectedUserType
            }));
            
            // Show success notification
            showNotification('Compte créé avec succès!', 'success');
            
            // Redirect based on user type
            setTimeout(() => {
                window.location.href = selectedUserType === 'owner' ? '/owner' : '/home';
            }, 1000);
        }

        function socialLogin(provider) {
            // Simulate social login
            showNotification(`Connexion avec ${provider} en cours...`, 'info');
            
            setTimeout(() => {
                localStorage.setItem('user', JSON.stringify({
                    email: 'user@' + provider + '.com',
                    name: 'Utilisateur ' + provider,
                    type: 'driver'
                }));
                
                showNotification('Connexion réussie!', 'success');
                
                setTimeout(() => {
                    window.location.href = '/home';
                }, 1000);
            }, 1500);
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.borderLeftColor = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff';
            notification.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 0.5rem;">${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'} ${message}</div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        selectUserType('driver');
        selectLoginType('driver');
    </script>
</body>
</html>
