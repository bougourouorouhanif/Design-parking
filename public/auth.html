<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parky - Connexion & Inscription</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="icons.css">
    <link rel="stylesheet" href="navbar-enhanced.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Redirection automatique vers la version moderne */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .redirect-container {
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .redirect-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        .redirect-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .redirect-text {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .redirect-btn {
            background: linear-gradient(135deg, #4A90E2, #7ED6A7);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-icon">🚀</div>
        <h1 class="redirect-title">Nouvelle Interface !</h1>
        <p class="redirect-text">
            Découvrez notre nouvelle page de connexion avec un design moderne<br>
            et une expérience utilisateur optimisée pour les conducteurs.
        </p>
        <a href="/auth-modern.html" class="redirect-btn">
            ✨ Accéder à la nouvelle version
        </a>
    </div>

    <script>
        // Redirection automatique après 3 secondes
        setTimeout(() => {
            window.location.href = '/auth-modern.html';
        }, 3000);
    </script>


</body>
</html>
